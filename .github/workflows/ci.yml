name: CI
on:
  push:
    # Merges into the integration and release branches run the full suite, so anything a
    # pull request's narrower tier skipped is still checked right after it lands.
    branches: [main, multiplayer, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      warmup_experiment:
        description: Run the approved main/M7 12-warmup comparison (not full acceptance)
        type: boolean
        default: false
      heap_diagnostics:
        description: Run only the isolated M6/M7 heap snapshot diagnosis (not acceptance)
        type: boolean
        default: false
      profile:
        description: Run every workload three times to remeasure the F3 budget
        type: boolean
        default: false
env:
  M5_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Wall-clock budgets (timing tests, M6 frozen performance gates, M7 first interactive) are
  # recorded but do not fail pull requests; .github/workflows/wallclock.yml enforces them nightly
  # and after every merge into multiplayer (docs/WORKFLOW_RULES_2026-10-19.md §4). Thresholds unchanged.
  # Pull requests and pushes to multiplayer record wall-clock budgets: wallclock.yml enforces the
  # same gates with the same thresholds after every multiplayer merge (vitest timing project and
  # explorer-bracer-restore-pressure -> vitest-timing; verify-m6-performance -> m6-performance;
  # m7-budget first-interactive -> m7-budget) and nightly. Pull requests into release/*, pushes to
  # main and release/*, and manual dispatches enforce them here.
  CI_WALLCLOCK_GATES: ${{ ((github.event_name == 'pull_request' && !startsWith(github.base_ref, 'release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/multiplayer')) && 'report' || 'enforce' }}
  WALLCLOCK_REPORT_DIR: artifacts/wallclock
permissions:
  contents: read
# A new push to the same PR cancels that PR's unfinished run. Pushes to multiplayer share one
# group that never cancels a running full run; GitHub keeps only the newest waiting one, which
# already contains the merges of any it replaces. Pushes to main and release/* and manual
# dispatches get a group per run, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/multiplayer') && 'push-multiplayer' || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  warmup-experiment:
    if: ${{ inputs.warmup_experiment }}
    uses: ./.github/workflows/m7-warmup-experiment.yml
  heap-diagnostics:
    if: ${{ inputs.heap_diagnostics && !inputs.warmup_experiment }}
    uses: ./.github/workflows/m7-heap-diagnostic.yml
  # Picks the tier from the files a pull request changes (.github/ci/classify-changes.cjs):
  # docs -> this job's text check only; ui -> type check, build, budgets, fast unit tests,
  # related timing tests and the interface browser checks; full -> everything. Pushes and
  # manual dispatches are always full. Unclassifiable files, a file list that cannot be read
  # or does not match the PR's changed-file count all fall back to full.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      related: ${{ steps.classify.outputs.related }}
      tb_parts: ${{ steps.classify.outputs.tb_parts }}
      input_parts: ${{ steps.classify.outputs.input_parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - name: Classifier self-test
        run: node .github/ci/classify-changes.cjs --self-test
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          result='{"tier":"full","reasons":["not a pull request"],"related":[],"docs":[]}'
          if [ "$EVENT" = pull_request ]; then
            if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
                 --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > "$RUNNER_TEMP/changes.tsv"; then
              count=$(grep -c . "$RUNNER_TEMP/changes.tsv" || true)
              # The files API lists at most 3000 files; a short or mismatched list runs full.
              if [ "$count" = "$EXPECTED" ] && [ "$count" -lt 3000 ]; then
                result=$(node .github/ci/classify-changes.cjs "$RUNNER_TEMP/changes.tsv")
              else
                result="{\"tier\":\"full\",\"reasons\":[\"listed $count files, PR reports $EXPECTED\"],\"related\":[],\"docs\":[]}"
              fi
              cut -f1,2,3 "$RUNNER_TEMP/changes.tsv"
            else
              result='{"tier":"full","reasons":["could not list changed files"],"related":[],"docs":[]}'
            fi
          fi
          echo "$result" | jq .
          tier=$(echo "$result" | jq -r .tier)
          case "$tier" in docs|ui|full) ;; *) echo "unknown tier $tier"; exit 1 ;; esac
          if [ "$tier" = docs ]; then
            # Lightweight docs check: every changed prose file is valid UTF-8 without merge markers.
            echo "$result" | jq -r '.docs[]' | while IFS= read -r file; do
              iconv -f UTF-8 -t UTF-8 "$file" > /dev/null || { echo "::error file=$file::not valid UTF-8"; exit 1; }
              if grep -nE '^(<<<<<<<|>>>>>>>) ' "$file"; then echo "::error file=$file::merge conflict marker"; exit 1; fi
            done
          fi
          if [ "$tier" = ui ]; then
            tb='["tests-1","tests-2","tests-3","tests-4"]'
            input='[{"mode":"dev","part":"input"},{"mode":"dev","part":"archives"},{"mode":"preview","part":"input"}]'
          else
            # Full lists also for docs: those jobs are skipped by tier, and a matrix needs values.
            tb='["tests-1","tests-2","tests-3","tests-4","headless"]'
            input='[{"mode":"dev","part":"input"},{"mode":"dev","part":"touch"},{"mode":"dev","part":"archives"},{"mode":"dev","part":"m6-performance"},{"mode":"preview","part":"input"},{"mode":"preview","part":"touch"}]'
          fi
          {
            echo "tier=$tier"
            echo "related=$(echo "$result" | jq -c .related)"
            echo "tb_parts=$tb"
            echo "input_parts=$input"
          } >> "$GITHUB_OUTPUT"
          echo "### CI tier: $tier" >> "$GITHUB_STEP_SUMMARY"
          echo "$result" | jq -r '.reasons[:20][] | "- " + .' >> "$GITHUB_STEP_SUMMARY"
  # Each part runs on its own machine so the wall-clock gates (timing tests,
  # repeated-route performance) never share CPU with other workloads. All parts
  # keep the logical M5_JOB_KEY, so compare-evidence still sees one
  # test-and-build job per sample with every required step.
  # Timing runs after shard 1 and repeated-route performance after headless on the same machine,
  # one step after another, so neither shares CPU with another workload.
  test-and-build:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier != 'docs' }}
    name: test-and-build-${{ matrix.part }}-sample${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        # The fast Vitest project is split into four shards (vitest --shard) on separate machines.
        part: ${{ fromJSON(needs.changes.outputs.tb_parts) }}
        sample: ${{ fromJSON(inputs.profile && '[1,2,3]' || '[1]') }}
    env:
      M5_JOB_KEY: test-and-build-sample${{ matrix.sample }}
      M5_JOB_PART: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22 # Three-sample measured budget; docs/evidence/M5_CI_BUDGET.json.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-m5-step.cjs install npm ci
      - name: Fast tests (parallel, one of four shards)
        if: ${{ startsWith(matrix.part, 'tests-') }}
        env:
          PART: ${{ matrix.part }}
        run: node scripts/ci-m5-step.cjs tests npm test -- --shard="${PART#tests-}/4"
      - name: Timing tests (one worker, serial files)
        if: ${{ !cancelled() && matrix.part == 'tests-1' && needs.changes.outputs.tier == 'full' }}
        run: node scripts/ci-m5-step.cjs timing npm run test:timing
      - name: Timing tests that import a changed interface file (ui tier)
        if: ${{ !cancelled() && matrix.part == 'tests-1' && needs.changes.outputs.tier == 'ui' && needs.changes.outputs.related != '[]' }}
        env:
          RELATED: ${{ needs.changes.outputs.related }}
        run: |
          mapfile -t files < <(echo "$RELATED" | jq -r '.[]')
          node scripts/ci-m5-step.cjs timing npx vitest related --run --project timing --no-file-parallelism --passWithNoTests "${files[@]}"
      - if: ${{ matrix.part == 'headless' }}
        run: node scripts/ci-m5-step.cjs build npm run build
      - name: Headless route evidence
        if: ${{ matrix.part == 'headless' }}
        run: node scripts/ci-m5-step.cjs headless npm run test:headless
      - name: Repeated route performance
        if: ${{ !cancelled() && matrix.part == 'headless' }}
        run: M5_EVIDENCE_DIR=artifacts/m5-performance node scripts/ci-m5-step.cjs performance npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-test-and-build-${{ matrix.part }}-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          path: artifacts/
  chromium-match:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier == 'full' }}
    name: browser-${{ matrix.mode }}-${{ matrix.build }}-sample${{ matrix.sample }}
    env:
      M5_JOB_KEY: browser-${{ matrix.mode }}-${{ matrix.build }}-sample${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28 # Maximum measured budget across six browser workloads.
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, preview]
        build: [cannon, sniper, mage]
        sample: ${{ fromJSON(inputs.profile && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-m5-step.cjs install npm ci
      - uses: ./.github/actions/playwright-cache
      - run: node scripts/ci-m5-step.cjs browser-install bash .github/ci/install-playwright.sh
      - run: node scripts/ci-m5-step.cjs build npm run build
      - name: Normal-time complete route
        env:
          MODE: ${{ matrix.mode }}
          BUILD: ${{ matrix.build }}
        run: |
          args=()
          if [ "$MODE" = preview ]; then args+=(--preview); fi
          if [ "$BUILD" = cannon ]; then args+=(--m6-journey); fi
          node scripts/ci-m5-step.cjs route node scripts/verify-m5-browser.cjs "${args[@]}" --build="$BUILD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-browser-${{ matrix.mode }}-${{ matrix.build }}-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          path: artifacts/
  # Split by workload so the longest input chain no longer sets the run's wall
  # clock. Every part keeps the logical M5_JOB_KEY input-<mode>-sample<n>, so
  # compare-evidence still finds every required step under one input job.
  # m6-performance (frozen F4 gates) gets its own machine; the short layout smoke runs after
  # native input on the input machine. The ui tier runs input (with layout) and archives only.
  chromium-input:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier != 'docs' }}
    name: input-${{ matrix.entry.mode }}-${{ matrix.entry.part }}-sample${{ matrix.sample }}
    env:
      M5_JOB_KEY: input-${{ matrix.entry.mode }}-sample${{ matrix.sample }}
      M5_JOB_PART: ${{ matrix.entry.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Unchanged per-part ceiling; the whole dev chain measured ~36 min on 2026-10-16.
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.changes.outputs.input_parts) }}
        sample: ${{ fromJSON(inputs.profile && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-m5-step.cjs install npm ci
      - uses: ./.github/actions/playwright-cache
      - run: node scripts/ci-m5-step.cjs browser-install bash .github/ci/install-playwright.sh
      - run: node scripts/ci-m5-step.cjs build npm run build
      - name: Native input
        if: ${{ matrix.entry.part == 'input' }}
        env:
          MODE: ${{ matrix.entry.mode }}
        run: |
          args=()
          if [ "$MODE" = preview ]; then args+=(--preview); fi
          node scripts/ci-m5-step.cjs input node scripts/verify-m5-input.cjs "${args[@]}"
      - name: Normal-time touch route
        if: ${{ matrix.entry.part == 'touch' }}
        env:
          MODE: ${{ matrix.entry.mode }}
        run: |
          args=()
          if [ "$MODE" = preview ]; then args+=(--preview); fi
          node scripts/ci-m5-step.cjs touch-route node scripts/verify-m5-browser.cjs "${args[@]}" --build=cannon --touch
      - name: M6 layout product smoke
        if: ${{ !cancelled() && matrix.entry.part == 'input' }}
        env:
          MODE: ${{ matrix.entry.mode }}
        run: |
          args=()
          if [ "$MODE" = preview ]; then args+=(--preview); fi
          node scripts/ci-m5-step.cjs m6-layout node scripts/m6-layout-product-smoke.cjs "${args[@]}"
      - name: M6/M8 storage, archives and application failures (dev)
        if: ${{ matrix.entry.part == 'archives' }}
        run: |
          node scripts/ci-m5-step.cjs m6-storage node scripts/verify-m6-storage.cjs
          node scripts/ci-m5-step.cjs m8-b9-legacy node scripts/verify-m8-b9-legacy.cjs
          node scripts/ci-m5-step.cjs m8-u7-compat node scripts/verify-m8-u7-compat.cjs
          node scripts/ci-m5-step.cjs m8-b9-archives node scripts/verify-m8-b9-archives.cjs
          node scripts/ci-m5-step.cjs m6-components node tests/m6-stats-browser.cjs
          node scripts/ci-m5-step.cjs m6-retry node tests/m6-persistence-retry.cjs
          node scripts/ci-m5-step.cjs m6-application-failures node tests/m6-application-failures.cjs
      - name: M6 performance gates (dev)
        if: ${{ matrix.entry.part == 'm6-performance' }}
        run: node scripts/ci-m5-step.cjs m6-performance node scripts/verify-m6-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-input-${{ matrix.entry.mode }}-${{ matrix.entry.part }}-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          path: artifacts/
  # U3 and U6 are short single-browser gates; they share one machine and keep their own
  # job keys, timing folders and artifacts (compare-evidence reads the U6 artifact by name).
  m8-ui-dynamic:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier != 'docs' }}
    name: m8-ui-dynamic
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # U3 (10) + U6 (20) ceilings.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-m5-step.cjs install npm ci
        env:
          M5_JOB_KEY: m8-u3-dynamic
      - uses: ./.github/actions/playwright-cache
      - run: node scripts/ci-m5-step.cjs browser-install bash .github/ci/install-playwright.sh
        env:
          M5_JOB_KEY: m8-u3-dynamic
      - name: Desktop equipment previews and native board drops (UR-U3-08)
        timeout-minutes: 10
        env:
          M5_JOB_KEY: m8-u3-dynamic
        run: node scripts/ci-m5-step.cjs m8-u3-dynamic node scripts/verify-m8-u3-dynamic.cjs
      - name: Live loot panel, loot pick, capacity wait and terminal record (U6)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          M5_JOB_KEY: m8-u6-loot
        run: node scripts/ci-m5-step.cjs m8-u6-loot node scripts/verify-m8-u6-loot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-u3-dynamic-${{ env.M5_COMMIT_SHA }}
          path: |
            artifacts/m8-u3-dynamic/
            artifacts/m5-ci-timing-m8-u3-dynamic/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-u6-loot-${{ env.M5_COMMIT_SHA }}
          path: |
            artifacts/m8-u6-loot/
            artifacts/m5-ci-timing-m8-u6-loot/
  m6-retention:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier == 'full' }}
    name: m6-retention
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-cache
      - run: bash .github/ci/install-playwright.sh
      - name: Independent native resources through the real application
        run: npm run test:retention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-retention-${{ env.M5_COMMIT_SHA }}
          path: artifacts/m6-retention/
  m7-presentation:
    needs: changes
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier != 'docs' }}
    name: m7-presentation-sample${{ matrix.sample }}
    env:
      M5_JOB_KEY: m7-presentation-sample${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.profile && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/ci-m5-step.cjs install npm ci
      - uses: ./.github/actions/playwright-cache
      - run: node scripts/ci-m5-step.cjs browser-install bash .github/ci/install-playwright.sh
      - run: node scripts/ci-m5-step.cjs build npm run build
      - name: Signed-off M6 interaction and M7 JS budget builds
        run: |
          git worktree add ../m6-base 631c131f1f2fd387c873f0fd8b5a238bca79dbe0
          ln -s "$PWD/node_modules" ../m6-base/node_modules
          (cd ../m6-base && npx vite build)
          # M8_PLAN §7.6: production JS gzip <= signed-off M7 x 1.50 (1.30 raised 2026-10-16 by user decision for the eight-player online code; see scripts/m7-budget.cjs).
          git worktree add ../m7-js-base 15313a75c6e74beec739fe52a2875c104c55eae3
          ln -s "$PWD/node_modules" ../m7-js-base/node_modules
          (cd ../m7-js-base && npx vite build)
      - name: M7 presentation, five viewports, sub-path deploy and budgets
        run: |
          mkdir -p artifacts
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > artifacts/m7-preview.log 2>&1 &
          until curl -s http://127.0.0.1:4173 > /dev/null; do sleep 1; done
          node scripts/ci-m5-step.cjs m7-presentation node scripts/verify-m7-presentation.cjs --url=http://127.0.0.1:4173 --out=artifacts/m7-presentation
          node scripts/ci-m5-step.cjs m7-screens node scripts/m7-screens.cjs --url=http://127.0.0.1:4173 --out=artifacts/m7-screens
          node scripts/ci-m5-step.cjs m7-subpath node scripts/verify-m7-subpath.cjs
          node scripts/ci-m5-step.cjs m7-budget node scripts/m7-budget.cjs --base=../m6-base/dist --js-base=../m7-js-base/dist --current=dist --out=artifacts/m7-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m7-presentation-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          path: artifacts/
  compare-evidence:
    if: ${{ !inputs.heap_diagnostics && !inputs.warmup_experiment && needs.changes.outputs.tier == 'full' }}
    name: compare-evidence-sample${{ matrix.sample }}
    needs: [changes, test-and-build, chromium-match, chromium-input, m6-retention, m8-ui-dynamic]
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # Temporary, user-approved: npm ci on the runner took 6+ min; about 2x (was 6: three measured comparison jobs, including artifact transfer).
    strategy:
      matrix:
        sample: ${{ fromJSON(inputs.profile && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.M5_COMMIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The final comparator recomputes the B8 Rageblade attack interval with the domain's readCombatStats.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-*-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          merge-multiple: true
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: m8-u6-loot-${{ env.M5_COMMIT_SHA }}
          path: u6-evidence/
      - run: node scripts/compare-m5-evidence.cjs --final
        env:
          M8_U6_EVIDENCE_DIR: u6-evidence
      - run: node scripts/compare-m6-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-comparison-sample${{ matrix.sample }}-${{ env.M5_COMMIT_SHA }}
          path: |
            artifacts/m5-cross-mode-comparison.json
            artifacts/m6-final-comparison.json
            artifacts/m6-validation.json
            artifacts/M6_VALIDATION.md
            artifacts/M6_REVIEW.md
  # The one check branch protection requires. It is green only when the classifier succeeded
  # and every job its tier selects finished green; a job may be skipped only when its tier
  # leaves it out (docs: all gate jobs; ui: complete routes, retention and compare-evidence).
  # Splitting or renaming the gate jobs never touches the protection rule. Wall-clock budgets
  # live in wallclock.yml and are not part of this gate.
  # !cancelled() lets a run superseded by a newer push end at once instead of queueing this job
  # for a runner while the PR's new run waits behind it. A skipped required check counts as
  # passing, so never cancel the run of a PR's latest commit by hand; to stop it, push a new commit.
  ci-required:
    if: ${{ !cancelled() }}
    name: ci-required
    needs: [changes, test-and-build, chromium-match, chromium-input, m8-ui-dynamic, m6-retention, m7-presentation, compare-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job the tier selects succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          echo "tier: ${TIER:-none}"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          case "$TIER" in
            docs) optional='["test-and-build","chromium-match","chromium-input","m8-ui-dynamic","m6-retention","m7-presentation","compare-evidence"]' ;;
            ui) optional='["chromium-match","m6-retention","compare-evidence"]' ;;
            full) optional='[]' ;;
            *) echo "changes job gave no tier"; exit 1 ;;
          esac
          echo "$NEEDS" | jq -e --argjson optional "$optional" \
            'to_entries | all(.value.result == "success" or (.value.result == "skipped" and (.key as $k | $optional | any(.[]; . == $k))))' > /dev/null
  # A red full run after a merge into multiplayer or release/* comments on the merged pull
  # request, so the failure is seen even though nothing is waiting on this run.
  post-merge-alert:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref != 'refs/heads/main' && needs.ci-required.result != 'success' }}
    needs: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Full CI after this merge into \`${GITHUB_REF_NAME}\` is red (${GITHUB_SHA::7}): ${RUN_URL}"
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].number')
          if [ -z "$prs" ]; then echo "::error::$body (no pull request found for this commit)"; exit 1; fi
          for pr in $prs; do gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"; done
          echo "::error::$body"
          exit 1
