name: Playwright browser cache
description: Restores ~/.cache/ms-playwright for the locked Playwright version; .github/ci/install-playwright.sh fills it on a miss.
inputs:
  working-directory:
    description: Directory whose package-lock.json pins the Playwright version.
    default: .
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.playwright }}
