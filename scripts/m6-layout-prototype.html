<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M6 F1 布局原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1018;color:#e2eef1;font:14px system-ui,sans-serif}header{padding:12px 16px;background:#14212c;display:flex;gap:12px;flex-wrap:wrap}header strong{color:#68ddd0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;max-width:1280px;margin:auto;gap:12px;padding:12px}.board{display:flex;justify-content:center;align-items:start;min-width:0;position:sticky;top:12px;align-self:start}canvas{display:block;width:min(100%,760px,calc((100dvh - 76px)*480/460));aspect-ratio:480/460;touch-action:none;background:#101923;border-radius:10px}.panels{min-width:0}section{padding:12px;background:#14212c;border-radius:8px;margin-bottom:12px}h2{font-size:16px;margin:0 0 10px}p{line-height:1.5;margin:8px 0}button{font:inherit;color:inherit;background:#304653;border:1px solid #527080;border-radius:6px;min-width:44px;min-height:44px;padding:6px;touch-action:manipulation;overflow-wrap:anywhere}button:focus-visible{outline:3px solid #ffd782}button[aria-pressed=true]{outline:2px solid #68ddd0;background:#28564f}.shop{display:grid;grid-template-columns:repeat(5,minmax(44px,1fr));gap:4px}.shop button{font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,minmax(44px,1fr));gap:6px}.roster{display:grid;grid-template-columns:repeat(2,minmax(44px,1fr));gap:6px}.deploy{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:1px}.deploy button{padding:0}summary{min-width:44px;min-height:44px;cursor:pointer;padding:12px 0}#status{min-height:44px;color:#ffe39b}.note{color:#a8c7d5;font-size:12px}.mounts{display:flex;gap:6px;flex-wrap:wrap}.main-actions{position:relative;z-index:3;border:1px solid #527080;background:#14212cf5}.seed{font-variant-numeric:tabular-nums}
@media(max-width:700px){.layout{grid-template-columns:1fr;padding:10px;gap:10px}.board{position:relative;top:0}canvas{width:100%}.panels section{padding:10px}.main-actions{position:relative}}
@media(max-width:1000px) and (orientation:landscape){.layout{grid-template-columns:minmax(0,1fr) 340px;padding:8px;gap:8px}.board{position:sticky;top:8px}.panels{max-height:calc(100dvh - 64px);overflow:auto}.panels section{padding:8px}canvas{width:min(100%,calc((100dvh - 76px)*480/460))}}
</style>
<header><strong>HEX · 自动战棋</strong><span>准备 · 2-1</span><span>金币 20 · 生命 100</span><span class="seed">种子 42</span></header>
<main class="layout"><div class="board"><canvas width="480" height="460" aria-label="八行七列棋盘；可通过下方 DOM 选中和部署"></canvas></div><aside class="panels">
<section><h2>商店 · 招募到备战席</h2><div class="shop"></div><p class="note">棋盘与商店分区。原型数据，无领域规则。</p></section>
<section><h2>选中单位与部署</h2><div class="roster"><button id="select">崔丝塔娜 ★ · 备战席</button><button>洛里斯 ★ · 最后一排</button></div><p>先选单位，再点下方部署位置</p><div class="deploy"></div><p id="status" aria-live="polite">请选择单位</p></section>
<section><h2>单位详情</h2><p>崔丝塔娜 ★ · 生命 500 / 500</p><p>法力 0 / 60 · 物理伤害 · 炮手</p><details><summary>羁绊与效果</summary><p>法师：全队 20 法强，成员最终 50 法强。</p><p>哨兵：全队 36 双抗，成员最终 75 双抗。</p></details><div class="mounts"><button>存档</button><button>回放</button><button>统计</button></div></section>
<section class="main-actions"><h2>主操作</h2><div class="actions"><button>D · 刷新</button><button>F · 经验</button><button>锁定商店</button><button>开始战斗</button><button>继续</button><button>新局</button></div></section>
</aside></main>
<script>
document.querySelector('.panels').prepend(document.querySelector('.main-actions'));
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let selected=false,cell={col:1,row:6};
function center(col,row){return{x:35+Math.sqrt(3)*34*(col+(row%2)/2),y:40+51*row}}
function draw(){ctx.clearRect(0,0,480,460);for(let row=0;row<8;row++)for(let col=0;col<7;col++){const p=center(col,row);ctx.beginPath();for(let i=0;i<6;i++){const a=(60*i-30)*Math.PI/180;ctx.lineTo(p.x+34*Math.cos(a),p.y+34*Math.sin(a))}ctx.closePath();ctx.fillStyle=row<4?'#30232e':'#1b3039';ctx.fill();ctx.strokeStyle='#527080';ctx.stroke()}for(const [col,row,label,color] of [[3,1,'敌','#b86372'],[cell.col,cell.row,'崔','#32a694'],[3,7,'洛','#5486b9']]){const p=center(col,row);ctx.beginPath();ctx.arc(p.x,p.y,27,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,p.x,p.y);ctx.fillStyle='#73db9a';ctx.fillRect(p.x-24,p.y-33,48,4)}}
document.querySelector('.shop').innerHTML=['崔丝塔娜','洛里斯','婕拉','盖伦','厄加特'].map(x=>'<button>'+x+'<br>2 金币</button>').join('');
const grid=document.querySelector('.deploy');for(let row=4;row<8;row++)for(let col=0;col<7;col++){const b=document.createElement('button');b.textContent=(col+1)+','+(row+1);b.dataset.cell=col+','+row;b.onclick=()=>{if(!selected)return;cell={col,row};document.querySelector('#status').textContent='已部署崔丝塔娜至 '+(col+1)+' 列 '+(row+1)+' 行';draw()};grid.append(b)}
document.querySelector('#select').onclick=e=>{selected=true;e.currentTarget.setAttribute('aria-pressed','true');document.querySelector('#status').textContent='已选中崔丝塔娜，请选择部署位置'};window.prototypeState=()=>({selected,cell});draw();
</script></html>
